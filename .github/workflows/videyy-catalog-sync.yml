# Once a day (00:30 WIB) plus on request. Pulls the koleksidrpinguin.com catalog export
# (/api/satelit/catalog.json) and the per-site panel settings (/api/satelit/config.json), writes
# data/synced-catalog.json, data/satelit-config.json and public/sync-status.json. The Worker bundles
# the data files; sync-status.json is a static asset the /pemilik panel reads for "Sync terakhir".
# No Worker cron, no per-visit fetch, no KV write on this path.
# "Sync sekarang" in /pemilik: workflow_dispatch / repository_dispatch (satelit-sync) from the main
# Worker, and as a fallback the 2-hourly poll below syncs when config.json has a newer request.
name: Videy catalog sync

on:
  schedule:
    - cron: "30 17 * * *"
    - cron: "10 */2 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [satelit-sync]

permissions:
  contents: write

concurrency:
  group: videyy-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pull catalog into the static snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VIDEY_SYNC_TOKEN: ${{ secrets.VIDEY_SYNC_TOKEN }}
          SYNC_MODE: ${{ github.event_name == 'schedule' && github.event.schedule != '30 17 * * *' && 'poll' || 'full' }}
          SYNC_TRIGGER: ${{ github.event_name == 'schedule' && (github.event.schedule == '30 17 * * *' && 'daily' || 'panel-request') || (github.event_name == 'workflow_dispatch' && 'manual' || 'panel-request') }}
        run: node scripts/videyy-sync.mjs

      - name: Commit snapshot when something changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/synced-catalog.json data/satelit-config.json public/sync-status.json src/lib/catalog/catalog-blocklist.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore(sync): koleksidrpinguin catalog snapshot + sync status"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then
              echo "Pushed OK"
              exit 0
            fi
            sleep 3
          done
          exit 1
